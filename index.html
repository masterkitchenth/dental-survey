<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1fb;
    --paper: #ffffff;
    --ink: #1f1a2b;
    --muted: #6a6078;
    --line: #d9cdec;
    --accent: #6b3fa0;
    --accent-dark: #4e2c7c;
    --accent-soft: #ece4f7;
    --error: #d4202b;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans Thai', 'Noto Sans Myanmar', 'Sarabun', 'Myanmar Text', sans-serif;
    font-size: 17px;
    line-height: 1.75; /* เผื่อสระ/วรรณยุกต์ไทยและอักษรพม่า */
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }

  /* ปุ่มเปลี่ยนภาษา: จุดเด่นของหน้านี้ */
  .lang {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--paper); border: 2px solid var(--accent);
    border-radius: 14px; padding: 6px; margin-bottom: 20px;
  }
  .lang button {
    font: inherit; font-weight: 700; font-size: 18px;
    padding: 10px 8px; border: 0; border-radius: 9px; cursor: pointer;
    background: transparent; color: var(--accent-dark);
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .card {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px 20px;
  }
  .hint { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .mascot { display: block; width: 100%; height: auto; border-radius: 12px; margin: 0 0 16px; }
  .brand { color: var(--muted); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

  h1 { font-size: 24px; line-height: 1.5; margin: 0 0 10px; }
  .intro {
    margin: 0 0 22px; padding: 12px 14px;
    background: var(--accent-soft); border-radius: 10px;
    color: var(--accent-dark); font-size: 16px;
  }
  .info {
    margin: 0 0 22px; padding: 14px 16px;
    border: 1.5px solid var(--line); border-radius: 12px; font-size: 16px;
  }
  .info dl { margin: 0; }
  .info dt { font-weight: 700; color: var(--accent-dark); margin-top: 10px; }
  .info dt:first-child { margin-top: 0; }
  .info dd { margin: 0; }

  h2 { font-size: 18px; margin: 26px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
  h2:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }

  .field { margin-bottom: 16px; }
  label, .legend { display: block; font-weight: 600; margin-bottom: 4px; }
  .req { color: var(--error); margin-left: 4px; }
  input[type="text"], input[type="tel"] {
    width: 100%; font: inherit; padding: 11px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  select {
    width: 100%; font: inherit; padding: 11px 12px;
    border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }
  input:focus-visible, select:focus-visible, button:focus-visible, .choice:has(input:focus-visible) {
    outline: 3px solid #f2b84b; outline-offset: 2px;
  }
  .invalid input[type="text"], .invalid input[type="tel"], .invalid select { border-color: var(--error); }
  .err { display: none; color: var(--error); font-size: 15px; margin-top: 2px; }
  .invalid .err { display: block; }

  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .choice input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

  .consent { margin-top: 22px; }
  .consent .choice { font-weight: 400; font-size: 15px; align-items: flex-start; line-height: 1.6; }
  .consent .choice input { margin-top: 3px; }

  .submit {
    width: 100%; margin-top: 8px; font: inherit; font-weight: 700; font-size: 18px;
    padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .submit:hover { background: var(--accent-dark); }
  .submit:disabled { background: #b7a3d3; cursor: default; }
  .form-error { display: none; color: var(--error); margin-top: 12px; text-align: center; }

  .done { display: none; text-align: center; padding: 20px 0; }
  .done .tick {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 36px; line-height: 64px;
  }
  .done p { color: var(--muted); margin: 6px 0 0; }
</style>
</head>

      infoBringT: 'ယူလာရမည့်အရာ',
      infoBring: 'နိုင်ငံသားမှတ်ပုံတင်ကတ် မူရင်းကို ယူဆောင်လာပါ။',
      infoWhenT: 'ရက်စွဲနှင့် အချိန်',

      infoContactT: 'ဆက်သွယ်ရန်',
      infoContact: 'ဖုန်း 02-096-4435 / LINE @atudental',
      sec1: '၁။ ဖြေဆိုသူ၏ အချက်အလက်',
      name: 'အမည် အပြည့်အစုံ',
      nameHint: 'မှတ်ပုံတင်ကတ်ပါ အမည်အတိုင်း ရေးပါ',
      phoneHint: 'ပြန်လည်ဆက်သွယ်ရန်အတွက်',
      dept: 'ဌာန / ဌာနခွဲ',
      deptPick: 'ဌာနကို ရွေးပါ',

      phoneErr: 'ဖုန်းနံပါတ် ၁၀ လုံး ဂဏန်းသာ ဖြည့်ပါ (ဥပမာ 0812345678)',
      chooseOne: 'တစ်ခုရွေးပေးပါ',
      consent: 'ဤစစ်တမ်းတွင် ဖြည့်သွင်းသော ကိုယ်ရေးအချက်အလက်များ (အမည်၊ ဌာန၊ ဖုန်းနံပါတ်၊ စိတ်ဝင်စားမှု) ကို သွားစစ်ဆေးမှု စီစဉ်ရန်နှင့် ဝန်ဆောင်မှုပေးသူ (AT U Dental Bus) နှင့် ညှိနှိုင်းဆက်သွယ်ရန်အတွက်သာ ကုမ္ပဏီက စုဆောင်းအသုံးပြုခြင်းနှင့် ပေးပို့ခြင်းကို ကျွန်ုပ် သဘောတူပါသည်။',
      consentErr: 'မပို့မီ သဘောတူကြောင်း အမှန်ခြစ်ပေးပါ',
      submit: 'စစ်တမ်း တင်သွင်းမည်',
      sending: 'ပို့နေပါသည်...',
      sendFail: 'ပို့၍မရပါ။ ထပ်ကြိုးစားပါ',
      thanks: 'စစ်တမ်းဖြေဆိုပေးသည့်အတွက် ကျေးဇူးတင်ပါသည်',
      thanksSub: 'သင့်အဖြေကို မှတ်တမ်းတင်ပြီးပါပြီ။ ရက်စွဲနှင့် အချိန်ကို နောက်မှ အသိပေးပါမည်။'
    }
  };

  let lang = 'th';

  function applyLang(next) {
    lang = next;
    document.documentElement.lang = next === 'my' ? 'my' : 'th';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = I18N[lang][el.dataset.i18n];
    });
    document.querySelectorAll('.lang button').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    const btn = document.getElementById('submitBtn');
    if (btn.disabled) btn.textContent = I18N[lang].sending;
  }

  document.querySelectorAll('.lang button').forEach(b => {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  });

  function setInvalid(field, bad) {
    document.querySelector('[data-field="' + field + '"]').classList.toggle('invalid', bad);
  }

  function validate() {
    const v = {
      name: document.getElementById('name').value.trim(),
      dept: document.getElementById('dept').value,
      phone: document.getElementById('phone').value.replace(/[\s-]/g, ''),
      interest: (document.querySelector('input[name="interest"]:checked') || {}).value || '',
      consent: document.getElementById('consent').checked
    };
    const bad = {
      name: !v.name,
      dept: !v.dept,
      phone: !/^0[0-9]{9}$/.test(v.phone),
      interest: !v.interest,
      consent: !v.consent
    };
    Object.keys(bad).forEach(k => setInvalid(k, bad[k]));
    const firstBad = Object.keys(bad).find(k => bad[k]);
    if (firstBad) {
      document.querySelector('[data-field="' + firstBad + '"]').scrollIntoView({ behavior: 'smooth', block: 'center' });
      return null;
    }
    return v;
  }

  document.getElementById('survey').addEventListener('submit', function (e) {
    e.preventDefault();
    const v = validate();
    if (!v) return;
    v.lang = lang;

    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('formError');
    errBox.style.display = 'none';
    btn.disabled = true;
    btn.textContent = I18N[lang].sending;

    // ส่งไป Apps Script Web App (ใช้ text/plain เพื่อเลี่ยง CORS preflight)
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(v)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || 'error');
        document.getElementById('formView').style.display = 'none';
        document.getElementById('doneView').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = I18N[lang].submit;
        errBox.style.display = 'block';
      });
  });

  applyLang('th');
</script>
